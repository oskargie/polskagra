<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitwa Łuczników</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-family: 'Segoe UI', Tahoma, sans-serif; padding: 10px;
        }
        h1 { color: #ffd700; font-size: 1.6em; margin-bottom: 8px; text-align: center; }
        .subtitle { color: #aab; font-size: 0.95em; margin-bottom: 16px; text-align: center; }
        canvas {
            border-radius: 12px; display: block;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-width: 100%; height: auto;
        }

        /* Setup */
        #setup {
            background: rgba(255,255,255,0.07); border-radius: 16px;
            padding: 28px 36px; max-width: 500px; width: 100%;
            text-align: center;
        }
        .count-btns { display: flex; gap: 10px; justify-content: center; margin: 14px 0 20px; }
        .count-btns button {
            font-size: 1.15em; padding: 10px 26px; border: 3px solid #445;
            border-radius: 12px; background: #223; color: #ccc; cursor: pointer;
        }
        .count-btns button.sel { background: #ffd700; color: #111; border-color: #ffd700; font-weight: bold; }
        .pname-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .pname-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
        .pname-row input {
            flex: 1; font-size: 1em; padding: 8px 12px; border: 2px solid #445;
            border-radius: 8px; background: #1a1a2e; color: #eee; outline: none;
        }
        .pname-row input:focus { border-color: #ffd700; }
        .start-btn {
            font-size: 1.25em; padding: 12px 40px; background: #ffd700; color: #111;
            border: none; border-radius: 12px; cursor: pointer; font-weight: bold;
            margin-top: 14px;
        }
        .start-btn:hover { background: #ffed4a; }

        /* Game UI */
        #game-ui { display: none; text-align: center; }
        .controls {
            display: flex; gap: 12px; align-items: center; justify-content: center;
            flex-wrap: wrap; margin-top: 10px; color: #fff;
        }
        .control-group { display: flex; align-items: center; gap: 8px; }
        .control-group label { font-size: 1em; min-width: 50px; }
        .control-group input[type=range] { width: 130px; accent-color: #ffd700; }
        .control-group .val { font-weight: bold; min-width: 36px; color: #ffd700; }
        #dir-btn {
            font-size: 1.1em; padding: 8px 18px; background: #445; color: #ffd700;
            border: 2px solid #ffd700; border-radius: 10px; cursor: pointer;
        }
        #arrow-btn {
            font-size: 1.1em; padding: 8px 16px; background: #334; color: #aad;
            border: 2px solid #556; border-radius: 10px; cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        #arrow-btn.fire {
            background: #5a1a00; color: #ff9944;
            border-color: #ff6600;
        }
        #fire-btn {
            font-size: 1.2em; padding: 10px 32px; background: #e74c3c;
            color: #fff; border: none; border-radius: 10px; cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        #fire-btn:hover:not(:disabled) { background: #c0392b; transform: scale(1.05); }
        #fire-btn:disabled { background: #555; cursor: default; }
        .turn-info { color: #fff; font-size: 1.1em; margin-top: 8px; }
        .turn-info .pn { font-weight: bold; font-size: 1.2em; }
        #wind-info { color: #aad; font-size: 0.95em; margin-top: 4px; }
        #shots-info { color: #ffd700; font-size: 0.95em; margin-top: 2px; }
        #restart-btn {
            font-size: 1.1em; padding: 10px 28px; background: #27ae60;
            color: #fff; border: none; border-radius: 10px; cursor: pointer;
            margin-top: 10px; display: none;
        }
        #restart-btn:hover { background: #219a52; }
        .legend { color: #888; font-size: 0.82em; margin-top: 6px; }
        .shop { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }
        .shop-btn {
            font-size: 0.95em; padding: 6px 14px; background: #1a3a2a;
            color: #4caf50; border: 2px solid #2e7d32; border-radius: 10px;
            cursor: pointer; transition: all 0.2s;
        }
        .shop-btn:hover:not(:disabled) { background: #2e5a3a; border-color: #4caf50; }
        .shop-btn:disabled { background: #333; color: #666; border-color: #555; cursor: default; }
    </style>
</head>
<body>

<h1>Bitwa Łuczników</h1>

<!-- SETUP -->
<div id="setup">
    <p class="subtitle">Wybierz liczbę graczy:</p>
    <div class="count-btns" id="count-btns"></div>
    <div id="pname-list"></div>
    <button class="start-btn" onclick="startGame()">Rozpocznij bitwę!</button>
</div>

<!-- GAME -->
<div id="game-ui">
    <canvas id="game" width="900" height="460"></canvas>
    <div id="wind-info"></div>
    <div id="shots-info"></div>
    <div class="turn-info">Tura: <span class="pn" id="turn-name"></span></div>
    <div class="shop">
        <button id="buy-shield" class="shop-btn" onclick="buyShield()">🛡️ Tarcza +1 HP (1 strzała)</button>
        <button id="buy-armor" class="shop-btn" onclick="buyArmor()">🪖 Zbroja +1 HP (1 strzała)</button>
    </div>
    <div class="controls">
        <button id="arrow-btn" onclick="toggleArrow()">🏹 Zwykła (1)</button>
        <button id="dir-btn" onclick="toggleDir()">← Lewo</button>
        <div class="control-group">
            <label>Kąt:</label>
            <input type="range" id="angle" min="5" max="85" value="45">
            <span class="val" id="angle-val">45°</span>
        </div>
        <div class="control-group">
            <label>Siła:</label>
            <input type="range" id="power" min="10" max="100" value="50">
            <span class="val" id="power-val">50</span>
        </div>
        <button id="fire-btn" onclick="fire()">Ognia!</button>
    </div>
    <div class="legend">Klawiatura: ↑↓ kąt · ←→ siła · D kierunek · F typ strzały · Enter/Spacja ogień · Za 1 strzałę: tarcza lub zbroja (+1 HP)</div>
    <button id="restart-btn" onclick="backToSetup()">Zagraj ponownie</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GRAVITY = 0.15;
const HITS_TO_WIN = 10;
const CW = 36, CH = 42;

const PCOLORS = ['#e74c3c','#3498db','#27ae60','#f39c12'];
const PDEFAULTS = ['Gracz 1','Gracz 2','Gracz 3','Gracz 4'];

let terrain = [];
let layout = [];
let playerCount = 2;
let players = [];
let castles = [];
let currentPlayer = 0;
let aimDir = 1;
let projectile = null;
let particles = [];
let trail = [];
let gameOver = false;
let wind = 0;
let canFire = true;
let alivePlayers = [];
let baseGround;
let fireArrow = false;

/* ═══ SETUP ═══ */

function buildSetup() {
    const btns = document.getElementById('count-btns');
    btns.innerHTML = '';
    for (let n = 2; n <= 4; n++) {
        const b = document.createElement('button');
        b.textContent = n;
        b.id = 'cnt-' + n;
        if (n === playerCount) b.className = 'sel';
        b.onclick = () => pickCount(n);
        btns.appendChild(b);
    }
    renderNameInputs();
}

function pickCount(n) {
    playerCount = n;
    document.querySelectorAll('#count-btns button').forEach(b => b.className = '');
    document.getElementById('cnt-' + n).className = 'sel';
    renderNameInputs();
}

function renderNameInputs() {
    const c = document.getElementById('pname-list');
    c.innerHTML = '';
    for (let i = 0; i < playerCount; i++) {
        const row = document.createElement('div');
        row.className = 'pname-row';
        row.innerHTML =
            `<div class="pname-dot" style="background:${PCOLORS[i]}"></div>` +
            `<input id="pn-${i}" placeholder="${PDEFAULTS[i]}" maxlength="14">`;
        c.appendChild(row);
    }
}

function startGame() {
    players = [];
    for (let i = 0; i < playerCount; i++) {
        const inp = document.getElementById('pn-' + i);
        const name = (inp && inp.value.trim()) || PDEFAULTS[i];
        players.push({ name, color: PCOLORS[i], shots: 10 });
    }

    document.getElementById('setup').style.display = 'none';
    document.getElementById('game-ui').style.display = 'block';

    baseGround = H - 50;
    generateLayout();
    buildTerrain();
    initCastles();
    alivePlayers = players.map((_, i) => i);
    currentPlayer = 0;
    aimDir = 1;
    gameOver = false;
    projectile = null;
    particles = [];
    trail = [];
    canFire = true;
    fireArrow = false;
    resetArrowBtn();

    randomWind();
    setDefaultDir();
    updateTurnUI();
    draw();
}

function backToSetup() {
    document.getElementById('game-ui').style.display = 'none';
    document.getElementById('setup').style.display = 'block';
    document.getElementById('restart-btn').style.display = 'none';
    buildSetup();
}

/* ═══ TERRAIN ═══ */

function generateLayout() {
    const margin = 70, minGap = 120;
    const positions = [];
    for (let i = 0; i < playerCount; i++) {
        let attempts = 0, cx;
        do {
            cx = margin + Math.random() * (W - 2 * margin);
            attempts++;
        } while (attempts < 200 && positions.some(px => Math.abs(px - cx) < minGap));
        positions.push(cx);
    }
    positions.sort((a, b) => a - b);
    layout = positions.map(cx => ({ x: cx, hill: Math.random() * 70 }));
}

let obstacles = [];

function buildTerrain() {
    terrain = new Array(W);
    for (let x = 0; x < W; x++) terrain[x] = baseGround;

    layout.forEach(cfg => {
        if (cfg.hill > 10) {
            const hillWidth = 80 + Math.random() * 40;
            for (let x = 0; x < W; x++) {
                const dist = Math.abs(x - cfg.x);
                if (dist < hillWidth) {
                    const t = 1 - dist / hillWidth;
                    terrain[x] -= cfg.hill * (0.5 + 0.5 * Math.cos(Math.PI * (1 - t)));
                }
            }
        }
    });

    // Extra random hills (2-4 additional)
    const extraHills = 2 + Math.floor(Math.random() * 3);
    for (let h = 0; h < extraHills; h++) {
        const hx = 40 + Math.random() * (W - 80);
        const hh = 15 + Math.random() * 50;
        const hw = 50 + Math.random() * 60;
        for (let x = 0; x < W; x++) {
            const dist = Math.abs(x - hx);
            if (dist < hw) {
                const t = 1 - dist / hw;
                terrain[x] -= hh * (0.5 + 0.5 * Math.cos(Math.PI * (1 - t)));
            }
        }
    }

    const seed1 = Math.random() * 10, seed2 = Math.random() * 10;
    for (let x = 0; x < W; x++) {
        terrain[x] += Math.sin(x * 0.015 + seed1) * 4 + Math.sin(x * 0.04 + seed2) * 2;
    }

    // Generate obstacles (1-2 trees or bushes)
    obstacles = [];
    const numObs = 2 + Math.floor(Math.random() * 3);
    const playerXs = layout.map(c => c.x);
    for (let i = 0; i < numObs; i++) {
        let ox, attempts = 0;
        do {
            ox = 50 + Math.random() * (W - 100);
            attempts++;
        } while (attempts < 100 && playerXs.some(px => Math.abs(px - ox) < 60));
        const gy = terrainAt(ox);
        const type = Math.random() < 0.5 ? 'tree' : 'bush';
        obstacles.push({ x: ox, groundY: gy, type });
    }
}

function drawObstacles() {
    obstacles.forEach(ob => {
        const x = ob.x, gy = ob.groundY;
        if (ob.type === 'tree') {
            ctx.fillStyle = '#5a3a1a';
            ctx.fillRect(x - 3, gy - 28, 6, 28);
            ctx.fillStyle = '#2d6b1e';
            ctx.beginPath();
            ctx.moveTo(x - 16, gy - 24);
            ctx.lineTo(x, gy - 50);
            ctx.lineTo(x + 16, gy - 24);
            ctx.fill();
            ctx.fillStyle = '#3a8a28';
            ctx.beginPath();
            ctx.moveTo(x - 12, gy - 32);
            ctx.lineTo(x, gy - 52);
            ctx.lineTo(x + 12, gy - 32);
            ctx.fill();
        } else {
            ctx.fillStyle = '#3d7a2a';
            ctx.beginPath(); ctx.arc(x, gy - 8, 10, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#4a9a35';
            ctx.beginPath(); ctx.arc(x - 6, gy - 10, 7, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 6, gy - 10, 7, 0, Math.PI * 2); ctx.fill();
        }
    });
}

function terrainAt(x) {
    return terrain[Math.max(0, Math.min(W - 1, Math.round(x)))];
}

/* ═══ INIT ═══ */

function initCastles() {
    castles = layout.map((cfg, i) => {
        const gy = terrainAt(cfg.x);
        return {
            x: cfg.x - CW / 2, y: gy - CH, groundY: gy,
            w: CW, h: CH, hp: HITS_TO_WIN, maxHp: HITS_TO_WIN,
            color: PCOLORS[i], alive: true,
            hasShield: false, hasArmor: false,
            roundShield: false, roundArmor: false
        };
    });
}

/* ═══ DRAW ═══ */

function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, baseGround);
    grad.addColorStop(0, '#0a1628');
    grad.addColorStop(0.5, '#1a3050');
    grad.addColorStop(1, '#2a5080');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#fff';
    for (let i = 0; i < 40; i++) {
        const sx = (i * 137 + 50) % W;
        const sy = (i * 97 + 20) % (baseGround - 70);
        ctx.fillRect(sx, sy, (i % 3 === 0) ? 2 : 1, (i % 3 === 0) ? 2 : 1);
    }

    ctx.beginPath(); ctx.arc(W / 2, 42, 18, 0, Math.PI * 2);
    ctx.fillStyle = '#ffe9a0'; ctx.fill();
    ctx.beginPath(); ctx.arc(W / 2 + 6, 39, 14, 0, Math.PI * 2);
    ctx.fillStyle = '#0a1628'; ctx.fill();
}

function drawTerrain() {
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x < W; x++) ctx.lineTo(x, terrain[x]);
    ctx.lineTo(W, H);
    ctx.closePath();

    const gG = ctx.createLinearGradient(0, baseGround - 70, 0, H);
    gG.addColorStop(0, '#3d7a2a');
    gG.addColorStop(0.3, '#2d5a1e');
    gG.addColorStop(1, '#1a3a10');
    ctx.fillStyle = gG;
    ctx.fill();

    ctx.strokeStyle = '#5a9a38'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, terrain[0]);
    for (let x = 1; x < W; x += 2) ctx.lineTo(x, terrain[x]);
    ctx.stroke();
}

function darken(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = Math.max(0, (n >> 16) - amt);
    let g = Math.max(0, ((n >> 8) & 0xff) - amt);
    let b = Math.max(0, (n & 0xff) - amt);
    return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

function drawArcher(c, idx) {
    if (!c.alive) return;
    const cx = c.x + c.w / 2;
    const baseY = c.groundY;
    const maxHp = c.maxHp || HITS_TO_WIN;
    const dmgMarks = maxHp - c.hp;
    const col = darken(c.color, Math.max(0, dmgMarks) * 10);

    // Legs
    ctx.strokeStyle = col; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx - 6, baseY); ctx.lineTo(cx - 2, baseY - 16);
    ctx.moveTo(cx + 6, baseY); ctx.lineTo(cx + 2, baseY - 16);
    ctx.stroke();

    // Torso
    ctx.fillStyle = col;
    ctx.fillRect(cx - 7, baseY - 32, 14, 16);

    // Arms
    ctx.strokeStyle = col; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(cx - 7, baseY - 28); ctx.lineTo(cx - 14, baseY - 22);
    ctx.moveTo(cx + 7, baseY - 28); ctx.lineTo(cx + 14, baseY - 22);
    ctx.stroke();

    // Head
    ctx.fillStyle = '#f5cfa0';
    ctx.beginPath(); ctx.arc(cx, baseY - 37, 6, 0, Math.PI * 2); ctx.fill();

    // Helmet
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(cx - 7, baseY - 37); ctx.lineTo(cx, baseY - 47); ctx.lineTo(cx + 7, baseY - 37);
    ctx.fill();

    // Shield
    if (c.hasShield) {
        ctx.fillStyle = 'rgba(100,149,237,0.6)';
        ctx.strokeStyle = '#4169e1'; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cx - 14, baseY - 30);
        ctx.lineTo(cx - 20, baseY - 28);
        ctx.lineTo(cx - 20, baseY - 20);
        ctx.lineTo(cx - 14, baseY - 16);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
    }

    // Armor
    if (c.hasArmor) {
        ctx.fillStyle = 'rgba(192,192,192,0.5)';
        ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
        ctx.fillRect(cx - 6, baseY - 31, 12, 14);
        ctx.strokeRect(cx - 6, baseY - 31, 12, 14);
        ctx.beginPath();
        ctx.moveTo(cx, baseY - 31); ctx.lineTo(cx, baseY - 17);
        ctx.moveTo(cx - 6, baseY - 24); ctx.lineTo(cx + 6, baseY - 24);
        ctx.stroke();
    }

    // Damage X marks
    ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 1.5;
    for (let i = 0; i < Math.min(dmgMarks, 7); i++) {
        const dx = cx - 4 + (i % 3) * 4;
        const dy = baseY - 30 + Math.floor(i / 3) * 5;
        ctx.beginPath();
        ctx.moveTo(dx - 2, dy - 2); ctx.lineTo(dx + 2, dy + 2);
        ctx.moveTo(dx + 2, dy - 2); ctx.lineTo(dx - 2, dy + 2);
        ctx.stroke();
    }

    // HP bar
    const bw = 36, bh = 5;
    const bx = cx - bw / 2, by = baseY - 56;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
    ctx.fillStyle = '#444'; ctx.fillRect(bx, by, bw, bh);
    const pct = c.hp / maxHp;
    ctx.fillStyle = pct > 0.4 ? '#2ecc71' : pct > 0.2 ? '#f39c12' : '#e74c3c';
    ctx.fillRect(bx, by, bw * pct, bh);

    ctx.fillStyle = '#fff'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(c.hp + '/' + maxHp, cx, by - 2);

    // Name
    ctx.fillStyle = c.color; ctx.font = 'bold 11px sans-serif';
    ctx.fillText(players[idx].name, cx, by - 13);

    // Highlight current player
    if (idx === currentPlayer && canFire && !gameOver) {
        ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
        ctx.strokeRect(cx - 16, baseY - 50, 32, 52);
        ctx.setLineDash([]);
    }
}

function drawBow(idx) {
    const c = castles[idx];
    if (!c.alive) return;
    const cx = c.x + c.w / 2;
    const cy = c.groundY - 28;
    const isActive = idx === currentPlayer && canFire && !gameOver;
    const angle = isActive ? parseInt(document.getElementById('angle').value) : 45;
    const dir = isActive ? aimDir : (c.x < W / 2 ? 1 : -1);
    const rad = -angle * Math.PI / 180;
    const bx = Math.cos(rad) * dir, by = Math.sin(rad);
    const aimAngle = Math.atan2(by, bx);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(aimAngle);

    // Bow arc
    ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, 14, -1.2, 1.2);
    ctx.stroke();

    // Bowstring
    ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(14 * Math.cos(-1.2), 14 * Math.sin(-1.2));
    ctx.lineTo(0, 0);
    ctx.lineTo(14 * Math.cos(1.2), 14 * Math.sin(1.2));
    ctx.stroke();

    // Arrow on bow
    ctx.strokeStyle = '#654321'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(20, 0); ctx.stroke();
    ctx.fillStyle = '#888';
    ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(16, -3); ctx.lineTo(16, 3); ctx.fill();

    ctx.restore();
}

function drawProjectile() {
    if (!projectile) return;
    const isFire = projectile.isFire;

    if (isFire) {
        trail.forEach(tp => {
            ctx.fillStyle = 'rgba(255,' + Math.floor(100 + tp.life * 100) + ',0,' + (tp.life * 0.7) + ')';
            ctx.beginPath(); ctx.arc(tp.x, tp.y, 2.5 * tp.life, 0, Math.PI * 2); ctx.fill();
        });
    } else {
        ctx.fillStyle = 'rgba(180,140,80,0.4)';
        trail.forEach(tp => {
            ctx.beginPath(); ctx.arc(tp.x, tp.y, 1.5 * tp.life, 0, Math.PI * 2); ctx.fill();
        });
    }

    const fAngle = Math.atan2(projectile.vy, projectile.vx);
    ctx.save();
    ctx.translate(projectile.x, projectile.y);
    ctx.rotate(fAngle);

    ctx.strokeStyle = isFire ? '#8B2500' : '#654321'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(8, 0); ctx.stroke();

    ctx.fillStyle = isFire ? '#ff4400' : '#888';
    ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(5, -2.5); ctx.lineTo(5, 2.5); ctx.fill();

    ctx.fillStyle = isFire ? '#ff6600' : '#cc4444';
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-7, -3); ctx.lineTo(-7, 0); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-7, 3); ctx.lineTo(-7, 0); ctx.fill();

    if (isFire) {
        ctx.fillStyle = 'rgba(255,100,0,0.4)';
        ctx.beginPath(); ctx.arc(4, 0, 5, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();
}

function drawParticles() {
    particles.forEach(p => {
        ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1;
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawTerrain();
    drawObstacles();
    castles.forEach((c, i) => drawArcher(c, i));
    castles.forEach((_, i) => drawBow(i));
    drawProjectile();
    drawParticles();
}

/* ═══ CONTROLS ═══ */

function toggleDir() {
    aimDir *= -1;
    document.getElementById('dir-btn').textContent = aimDir === -1 ? '← Lewo' : 'Prawo →';
    draw();
}

function setDefaultDir() {
    const c = castles[currentPlayer];
    aimDir = (c.x + c.w / 2 < W / 2) ? 1 : -1;
    document.getElementById('dir-btn').textContent = aimDir === -1 ? '← Lewo' : 'Prawo →';
}

function toggleArrow() {
    fireArrow = !fireArrow;
    resetArrowBtn();
}

function resetArrowBtn() {
    const btn = document.getElementById('arrow-btn');
    if (fireArrow) {
        btn.textContent = '🔥 Paląca (2)';
        btn.className = 'fire';
        btn.id = 'arrow-btn';
    } else {
        btn.textContent = '🏹 Zwykła (1)';
        btn.className = '';
        btn.id = 'arrow-btn';
    }
}

/* ═══ FIRE & PHYSICS ═══ */

function fire() {
    if (!canFire || gameOver) return;
    const p = players[currentPlayer];
    const cost = fireArrow ? 2 : 1;
    if (p.shots < cost) return;

    canFire = false;
    document.getElementById('fire-btn').disabled = true;
    p.shots -= cost;
    updateTurnUI();

    const c = castles[currentPlayer];
    const cx = c.x + c.w / 2, cy = c.groundY - 28;
    const angle = parseInt(document.getElementById('angle').value);
    const power = parseInt(document.getElementById('power').value) * 0.3;
    const rad = -angle * Math.PI / 180;
    const bx = Math.cos(rad) * aimDir, by = Math.sin(rad);

    projectile = {
        x: cx + bx * 24, y: cy + by * 24,
        vx: bx * power, vy: by * power,
        isFire: fireArrow,
        damage: fireArrow ? 2 : 1
    };
    trail = [];
    requestAnimationFrame(updateProjectile);
}

function updateProjectile() {
    if (!projectile) return;

    projectile.vx += wind;
    projectile.vy += GRAVITY;
    projectile.x += projectile.vx;
    projectile.y += projectile.vy;

    trail.push({ x: projectile.x, y: projectile.y, life: 1 });
    trail = trail.filter(tp => { tp.life -= 0.05; return tp.life > 0; });

    // Hit check
    for (let i = 0; i < castles.length; i++) {
        if (i === currentPlayer || !castles[i].alive) continue;
        const oc = castles[i];
        if (projectile.x > oc.x && projectile.x < oc.x + oc.w &&
            projectile.y > oc.y && projectile.y < oc.y + oc.h) {
            oc.hp -= projectile.damage;
            if (oc.hp < 0) oc.hp = 0;
            const hitColor = projectile.isFire ? '#ff4400' : players[currentPlayer].color;
            spawnExplosion(projectile.x, projectile.y, hitColor);
            if (projectile.isFire) spawnExplosion(projectile.x, projectile.y, '#ff8800');
            projectile = null;

            if (oc.hp <= 0) {
                oc.alive = false;
                alivePlayers = alivePlayers.filter(p => p !== i);
                spawnExplosion(oc.x + oc.w / 2, oc.y + oc.h / 2, oc.color);
            }

            if (alivePlayers.length <= 1) {
                setTimeout(() => endGame(alivePlayers[0]), 500);
            } else {
                setTimeout(nextTurn, 700);
            }
            draw();
            return;
        }
    }

    const groundHere = terrainAt(projectile.x);
    if (projectile.y > groundHere || projectile.x < -20 || projectile.x > W + 20) {
        if (projectile.y >= groundHere - 4 && projectile.x > 0 && projectile.x < W) {
            spawnExplosion(projectile.x, groundHere - 2, '#8B7355');
        }
        projectile = null;
        setTimeout(nextTurn, 500);
        draw();
        return;
    }

    draw();
    requestAnimationFrame(updateProjectile);
}

/* ═══ EFFECTS ═══ */

function spawnExplosion(x, y, color) {
    for (let i = 0; i < 24; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5 - 1.5,
            size: 2 + Math.random() * 3,
            life: 1,
            color: i % 3 === 0 ? color : i % 3 === 1 ? '#ff9900' : '#ffcc00'
        });
    }
    animateParticles();
}

function animateParticles() {
    if (particles.length === 0) return;
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= 0.03; });
    particles = particles.filter(p => p.life > 0);
    draw();
    if (particles.length > 0) requestAnimationFrame(animateParticles);
}

/* ═══ TURNS & END ═══ */

function nextTurn() {
    const anyShots = alivePlayers.some(i => players[i].shots > 0);
    if (!anyShots) {
        let bestIdx = alivePlayers[0];
        let bestHp = castles[bestIdx].hp;
        for (const i of alivePlayers) {
            if (castles[i].hp > bestHp) { bestHp = castles[i].hp; bestIdx = i; }
        }
        endGame(bestIdx);
        return;
    }

    let next = currentPlayer;
    do {
        next = (next + 1) % playerCount;
    } while (!castles[next].alive || players[next].shots <= 0);
    currentPlayer = next;

    randomWind();
    setDefaultDir();
    fireArrow = false;
    resetArrowBtn();
    canFire = true;
    document.getElementById('fire-btn').disabled = false;
    updateTurnUI();
    draw();
}

function randomWind() {
    wind = (Math.random() - 0.5) * 0.12;
    const dir = wind > 0 ? '→' : '←';
    const s = Math.abs(wind);
    const str = s < 0.02 ? 'Słaby' : s < 0.04 ? 'Umiarkowany' : 'Silny';
    document.getElementById('wind-info').textContent = 'Wiatr: ' + str + ' ' + dir;
}

function buyShield() {
    if (!canFire || gameOver) return;
    const p = players[currentPlayer];
    const c = castles[currentPlayer];
    if (p.shots < 1 || c.roundShield) return;
    p.shots -= 1;
    c.hp += 1; c.maxHp += 1; c.hasShield = true;
    c.roundShield = true;
    updateTurnUI();
    draw();
}

function buyArmor() {
    if (!canFire || gameOver) return;
    const p = players[currentPlayer];
    const c = castles[currentPlayer];
    if (p.shots < 1 || c.roundArmor) return;
    p.shots -= 1;
    c.hp += 1; c.maxHp += 1; c.hasArmor = true;
    c.roundArmor = true;
    updateTurnUI();
    draw();
}

function updateShopButtons() {
    const p = players[currentPlayer];
    const c = castles[currentPlayer];
    document.getElementById('buy-shield').disabled = !canFire || gameOver || p.shots < 1 || c.roundShield;
    document.getElementById('buy-armor').disabled = !canFire || gameOver || p.shots < 1 || c.roundArmor;
}

function updateTurnUI() {
    const p = players[currentPlayer];
    const el = document.getElementById('turn-name');
    el.textContent = p.name;
    el.style.color = p.color;
    document.getElementById('shots-info').textContent = 'Strzały: ' + p.shots;
    updateShopButtons();
}

function endGame(winnerIdx) {
    gameOver = true;
    const el = document.getElementById('turn-name');
    el.textContent = players[winnerIdx].name + ' wygrywa!';
    el.style.color = players[winnerIdx].color;
    document.getElementById('fire-btn').disabled = true;
    document.getElementById('restart-btn').style.display = 'inline-block';

    const wc = castles[winnerIdx];
    for (let i = 0; i < 6; i++) {
        setTimeout(() => {
            spawnExplosion(wc.x + Math.random() * wc.w, wc.y - 15 - Math.random() * 30, '#ffd700');
        }, i * 200);
    }
}

/* ═══ EVENTS ═══ */

document.getElementById('angle').addEventListener('input', e => {
    document.getElementById('angle-val').textContent = e.target.value + '°';
    draw();
});
document.getElementById('power').addEventListener('input', e => {
    document.getElementById('power-val').textContent = e.target.value;
    draw();
});

document.addEventListener('keydown', e => {
    if (document.getElementById('game-ui').style.display === 'none') {
        if (e.key === 'Enter') startGame();
        return;
    }
    const aEl = document.getElementById('angle');
    const pEl = document.getElementById('power');
    if (e.key === 'ArrowUp') { aEl.value = Math.min(85, +aEl.value + 1); aEl.dispatchEvent(new Event('input')); }
    if (e.key === 'ArrowDown') { aEl.value = Math.max(5, +aEl.value - 1); aEl.dispatchEvent(new Event('input')); }
    if (e.key === 'ArrowRight') { pEl.value = Math.min(100, +pEl.value + 2); pEl.dispatchEvent(new Event('input')); }
    if (e.key === 'ArrowLeft') { pEl.value = Math.max(10, +pEl.value - 2); pEl.dispatchEvent(new Event('input')); }
    if (e.key === 'd' || e.key === 'D') toggleDir();
    if (e.key === 'f' || e.key === 'F') { toggleArrow(); }
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fire(); }
});

buildSetup();
</script>
</body>
</html>
